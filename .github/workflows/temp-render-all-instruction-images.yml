name: TEMP render all instruction images

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Comma-separated font sizes in pixels"
        required: true
        default: "8,9,10,11,12,13,14,16"
      retention_days:
        description: "Artifact retention days"
        required: true
        default: "7"
  push:
    paths:
      - ".github/workflows/temp-render-all-instruction-images.yml"
      - "scripts/render_all_instruction_images.py"
      - "scripts/fetch_fonts.py"
      - "src/vce/render.py"
      - "src/vce/fonts.py"
      - "src/vce/dataset.py"
      - "dataset/tasks.jsonl"
      - "fonts/manifest.json"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fetch exact benchmark fonts
        run: python scripts/fetch_fonts.py

      - name: Render every task, font and size
        env:
          INPUT_SIZES: ${{ github.event.inputs.sizes }}
        run: |
          SIZES="${INPUT_SIZES:-8,9,10,11,12,13,14,16}"
          python scripts/render_all_instruction_images.py \
            --tasks dataset/tasks.jsonl \
            --sizes "$SIZES" \
            --margin 1 \
            --line-gap 1 \
            --patch-multiplier 1.2 \
            --output rendered/all-instructions

      - name: Verify image count and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tasks = sum(1 for line in Path("dataset/tasks.jsonl").read_text(encoding="utf-8").splitlines() if line.strip())
          fonts = len(json.loads(Path("fonts/installed.json").read_text(encoding="utf-8"))["fonts"])
          sizes_raw = "${{ github.event.inputs.sizes }}" or "8,9,10,11,12,13,14,16"
          sizes = [x for x in sizes_raw.split(",") if x.strip()]
          expected = tasks * fonts * len(sizes)
          pngs = list(Path("rendered/all-instructions").rglob("*.png"))
          manifest = [line for line in Path("rendered/all-instructions/manifest.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          print(f"tasks={tasks} fonts={fonts} sizes={len(sizes)} expected={expected} pngs={len(pngs)} manifest={len(manifest)}")
          if len(pngs) != expected or len(manifest) != expected:
              raise SystemExit("render count mismatch")
          PY

      - name: Commit rendered images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f rendered/all-instructions
          if git diff --cached --quiet; then
            echo "No rendered image changes to commit."
          else
            git commit -m "data: commit rendered instruction image matrix"
            git push origin HEAD:main
          fi

      - name: Upload rendered image matrix
        uses: actions/upload-artifact@v4
        with:
          name: visual-context-instruction-images-${{ github.run_id }}
          path: rendered/all-instructions/
          if-no-files-found: error
          compression-level: 6
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
